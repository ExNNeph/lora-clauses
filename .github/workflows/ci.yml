name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"  # no MLX: the runner is not Apple Silicon, so nothing is downloaded or trained
      - run: pytest  # models and Claude are stubbed
