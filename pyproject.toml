[project]
name = "lora-clauses"
version = "0.1.0"
description = "LoRA fine-tuning of a 1.7B model with MLX on a MacBook: a local contract-clause risk classifier, benchmarked against the base model and Claude."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "anthropic>=0.80"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.30"]
demo = ["mlx-lm>=0.30", "streamlit>=1.50"]
dev = ["pytest", "streamlit>=1.50"]

[project.scripts]
lora-clauses = "lora_clauses.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lora_clauses = ["risks.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
