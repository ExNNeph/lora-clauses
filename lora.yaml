# mlx_lm.lora settings, used by `lora-clauses train`. Sized to keep a 16 GB M1 Pro usable while it trains.
model: mlx-community/Qwen3-1.7B-4bit
train: true
fine_tune_type: lora
data: .mlx-data          # written by `lora-clauses train` from data/train.jsonl and data/valid.jsonl
adapter_path: adapters
mask_prompt: true        # learn only the answer, not the clause
num_layers: 16           # LoRA on the last 16 of 28 layers
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.0}
batch_size: 4
iters: 600               # about 3 epochs over the training set
learning_rate: 1.0e-4
max_seq_length: 512
steps_per_report: 10
steps_per_eval: 100
val_batches: -1          # the whole validation set
save_every: 100
seed: 0
